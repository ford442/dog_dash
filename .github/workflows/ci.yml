name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (baseline ratchet)
        run: npm run typecheck:ci

      - name: Unit tests
        run: npm run test:unit

      - name: Build (brace check, WASM, Vite)
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    # Phase A: soft-fail while monitoring stability. Remove continue-on-error after
    # 3 consecutive green smoke runs on main (see README Testing — Smoke promotion).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: browser-actions/setup-chrome@v1

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Build production bundle
        run: npm run build

      - name: Run WebGPU boot-probe smoke test
        run: npm run test:smoke

  cpp-wasm:
    runs-on: ubuntu-latest
    # Experimental backend — failures must not block the AS default path.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Build C++ WASM
        run: npm run build:cpp-wasm

      - name: Verify C++ WASM instantiates
        run: npm run verify:cpp-wasm

      - name: Verify soft-body Verlet consumer (Option A)
        run: npm run verify:cpp-softbody
