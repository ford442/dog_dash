name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (baseline ratchet)
        run: npm run typecheck:ci

      - name: Build (brace check, WASM, Vite)
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Build production bundle
        run: npm run build

      - name: Run WebGL smoke test
        run: npm run test:smoke

  cpp-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Emscripten
        uses: mychalom/workflow-setup-emsdk@v3
        with:
          version: 'latest'

      - name: Build C++ WASM
        run: npm run build:cpp-wasm

      - name: Verify C++ WASM instantiates
        run: npm run verify:cpp-wasm
